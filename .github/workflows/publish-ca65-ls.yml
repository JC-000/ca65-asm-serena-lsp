# Build + publish ca65-ls to PyPI on a `ca65-ls-vX.Y.Z` tag push.
#
# Uses PyPI's trusted-publisher OIDC flow — no API token in secrets.
# Before the first release: register this repository, workflow, and the
# `release` environment on PyPI under Trusted Publishers for the project.
# See https://docs.pypi.org/trusted-publishers/.
#
# The tree-sitter-ca65 grammar is vendored and compiled as an abi3 C
# extension (see packages/ca65-ls/vendor/tree-sitter-ca65/NOTICE.md), so
# wheels are platform-specific: one cp310-abi3 wheel per OS/arch, built by
# cibuildwheel, covering CPython 3.10+.

name: Publish ca65-ls to PyPI

on:
  push:
    tags:
      - "ca65-ls-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to publish from (defaults to the tag triggering the run)"
        required: false

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist
        working-directory: packages/ca65-ls
        run: uv build --sdist --out-dir ../../dist

      - name: Validate sdist (twine check)
        run: uv tool run --with twine twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/

  build_wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.0
        with:
          package-dir: packages/ca65-ls
          output-dir: dist
        env:
          # The extension targets the limited API (abi3), so a single
          # cp310 build covers all supported CPython versions.
          CIBW_BUILD: "cp310-*"
          CIBW_ARCHS_MACOS: universal2
          # Smoke-test each built wheel: vendored grammar loads and parses.
          CIBW_TEST_COMMAND: >-
            python -c "from tree_sitter import Language, Parser;
            from ca65_ls import _grammar;
            t = Parser(Language(_grammar.language())).parse(b'.proc m\nrts\n.endproc\n');
            assert t.root_node.type == 'source' and not t.root_node.has_error"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build_sdist, build_wheels]
    runs-on: ubuntu-latest
    # PyPI trusted publishing requires the workflow to declare an environment.
    environment:
      name: release
      url: https://pypi.org/project/ca65-ls/
    permissions:
      id-token: write   # OIDC
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI via trusted-publisher OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
