[build-system]
# setuptools (not hatchling): the vendored tree-sitter-ca65 grammar is
# compiled as a C extension (ca65_ls._grammar._binding) via setup.py.
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ca65-ls"
version = "0.1.0"
description = "Language server (LSP) for CA65 6502/65C02/65816 assembly, designed for Serena MCP integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JC-000" }]
keywords = ["lsp", "language-server", "ca65", "cc65", "6502", "65C02", "65816", "assembly", "nes", "c64", "serena", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Assembly",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Assemblers",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]
dependencies = [
    "pygls>=1.3.0",
    "tree-sitter>=0.22",
    "pathspec>=0.12",
    # The tree-sitter-ca65 grammar (pogyomo/tree-sitter-ca65 @ b22ead1) is
    # VENDORED under vendor/tree-sitter-ca65/ and compiled into the wheel as
    # ca65_ls._grammar._binding — no external grammar dependency. Provenance
    # and update procedure: vendor/tree-sitter-ca65/NOTICE.md.
]

[project.urls]
Homepage = "https://github.com/JC-000/ca65-asm-serena-lsp"
Repository = "https://github.com/JC-000/ca65-asm-serena-lsp"
Issues = "https://github.com/JC-000/ca65-asm-serena-lsp/issues"
"Serena Integration" = "https://github.com/oraios/serena"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
ca65-ls = "ca65_ls.server:main"
ca65-dbg-dump = "ca65_ls.index.dbg_oracle:main"

[tool.setuptools.packages.find]
include = ["ca65_ls*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
