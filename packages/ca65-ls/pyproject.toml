[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ca65-ls"
version = "0.1.0"
description = "Language server for CA65 (cc65 toolchain) assembly, designed for Serena MCP integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JC-000" }]
dependencies = [
    "pygls>=1.3.0",
    "tree-sitter>=0.22",
    # tree-sitter-ca65 is not on PyPI; install from git as a dev dep below
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pathspec>=0.12",
    # tree-sitter-ca65: pogyomo/tree-sitter-ca65 is the live successor to the
    # 404'd babasbot repo (per docs/research/ts-ca65-coverage.md). Pinned to a
    # commit, not a branch, so M2 doesn't drift.
    "tree-sitter-ca65 @ git+https://github.com/pogyomo/tree-sitter-ca65@b22ead1",
]

[project.scripts]
ca65-ls = "ca65_ls.server:main"
ca65-dbg-dump = "ca65_ls.index.dbg_oracle:main"

[tool.hatch.build.targets.wheel]
packages = ["ca65_ls"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
